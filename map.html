<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Карта Мира · Deep Dive Online</title>
  <style>
    :root {
      --bg:      #313338;
      --surface: #2b2d31;
      --surface-deep: #1e1f22;
      --fg:      #dbdee1;
      --fg-2:    #f2f3f5;
      --muted:   #949ba4;
      --border:  rgba(255, 255, 255, 0.06);
      --accent:  #00a8fc;
      --success: #23a55a;
      --danger:  #f23f43;
      --warn:    #f0b232;

      --font-display: "gg sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-body:    "gg sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono:    "gg mono", ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --container: 1120px;
      --gutter: 32px;
      --radius: 4px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    h1, h2 { color: var(--fg-2); margin: 0; }

    .container { max-width: var(--container); margin-inline: auto; padding-inline: var(--gutter); }

    .topnav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(30, 31, 34, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 16px; }
    .logo { font-size: 20px; font-weight: 800; color: var(--fg-2); display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 24px; height: 24px; background: var(--accent); border-radius: 6px; }
    .topnav nav { display: flex; gap: 32px; }
    .topnav nav a { font-size: 14px; font-weight: 500; color: var(--muted); }
    .topnav nav a:hover, .topnav nav a.active { color: var(--fg-2); }

    .map-container {
      width: 100%; height: 70vh; min-height: 500px;
      background: var(--surface-deep);
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      margin-block: 40px;
      cursor: grab;
    }
    .map-container:active { cursor: grabbing; }

    .map-svg {
      width: 2000px; height: 1200px;
      transition: transform 0.1s ease-out;
      transform-origin: 0 0;
    }

    .map-controls {
      position: absolute; bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 10;
    }
    .map-btn {
      width: 40px; height: 40px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--fg-2); display: grid; place-items: center;
      cursor: pointer; font-size: 20px; font-weight: 700;
    }
    .map-btn:hover { background: var(--accent); border-color: var(--accent); }

    .marker { cursor: pointer; transition: transform 0.2s ease; }
    .marker:hover { transform: scale(1.2); }
    .marker-label {
      font-size: 12px; font-family: var(--font-mono); font-weight: 700;
      fill: white; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    .info-panel {
      position: absolute; top: 20px; left: 20px;
      width: 280px; background: rgba(30, 31, 34, 0.9);
      backdrop-filter: blur(8px); border: 1px solid var(--border);
      border-radius: 8px; padding: 20px; z-index: 10;
      pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
    }
    .info-panel.visible { opacity: 1; pointer-events: auto; }

    .pagefoot { padding-block: 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header class="topnav">
    <div class="container topnav-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon"></div>
        DEEP DIVE ONLINE
      </a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="wiki.html">Вики</a>
        <a href="map.html" class="active">Карта</a>
        <a href="donate.html">Донат</a>
      </nav>
      <div style="width: 140px;"></div>
    </div>
  </header>

  <main class="container">
    <header style="padding-top: 40px;" data-od-id="map-header">
      <h1>Интерактивная карта мира</h1>
      <p style="color: var(--muted); margin-top: 12px;">Используйте мышь для перемещения и колесо для масштабирования.</p>
    </header>

    <div class="map-container" id="mapContainer" data-od-id="interactive-map">
      <div id="infoPanel" class="info-panel">
        <h3 id="infoTitle" style="color: var(--accent); margin-bottom: 8px;">Локация</h3>
        <p id="infoDesc" style="font-size: 13px; color: var(--fg); margin: 0;">Описание локации появится здесь.</p>
      </div>

      <div class="map-controls">
        <button class="map-btn" onclick="zoomIn()">+</button>
        <button class="map-btn" onclick="zoomOut()">−</button>
      </div>

      <svg class="map-svg" id="mapSvg" viewBox="0 0 2000 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Water / Background -->
        <rect width="2000" height="1200" fill="var(--surface-deep)"/>
        
        <!-- Landmasses (Simplified) -->
        <path d="M400 200C500 100 800 150 900 300C1000 450 950 700 800 800C650 900 400 850 300 700C200 550 300 300 400 200Z" fill="var(--success)" fill-opacity="0.2" stroke="var(--success)" stroke-width="2"/>
        <path d="M1200 400C1400 300 1700 400 1800 600C1900 800 1700 1000 1500 1100C1300 1200 1100 1000 1000 800C900 600 1000 500 1200 400Z" fill="var(--success)" fill-opacity="0.15" stroke="var(--success)" stroke-width="2"/>
        
        <!-- Mountains / Dungeons -->
        <circle cx="650" cy="450" r="40" fill="#4e5058" fill-opacity="0.5"/>
        <circle cx="1450" cy="750" r="60" fill="#4e5058" fill-opacity="0.5"/>

        <!-- Markers -->
        <g class="marker" onclick="showInfo('Начальный Город', 'Центральный хаб для всех новых игроков. Здесь находятся основные магазины и гильдии.')">
          <circle cx="500" cy="400" r="12" fill="var(--accent)" stroke="white" stroke-width="2"/>
          <text x="500" y="380" text-anchor="middle" class="marker-label">ГОРОД НАЧАЛА</text>
        </g>

        <g class="marker" onclick="showInfo('Лес Древних', 'Опасная зона для игроков 10-20 уровня. Обитель лесных волков.')">
          <circle cx="800" cy="600" r="8" fill="var(--success)" stroke="white" stroke-width="2"/>
          <text x="800" y="585" text-anchor="middle" class="marker-label">ЛЕС ДРЕВНИХ</text>
        </g>

        <g class="marker" onclick="showInfo('Подземелье Страха', 'Первое серьезное испытание. В конце ждет босс: Король Гоблинов.')">
          <path d="M1400 500L1415 530H1385L1400 500Z" fill="var(--danger)" stroke="white" stroke-width="2"/>
          <text x="1400" y="490" text-anchor="middle" class="marker-label">DUNGEON</text>
        </g>

        <g class="marker" onclick="showInfo('Небесный Замок', 'Финальная локация текущего этажа. Только для самых сильных.')">
          <rect x="1550" y="250" width="24" height="24" fill="var(--warn)" stroke="white" stroke-width="2"/>
          <text x="1562" y="240" text-anchor="middle" class="marker-label">SKY CASTLE</text>
        </g>
      </svg>
    </div>
  </main>

  <script>
    const container = document.getElementById('mapContainer');
    const svg = document.getElementById('mapSvg');
    const infoPanel = document.getElementById('infoPanel');
    const infoTitle = document.getElementById('infoTitle');
    const infoDesc = document.getElementById('infoDesc');

    let scale = 0.6;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX, startY;

    function updateTransform() {
      svg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mouseup', () => isDragging = false);

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      scale *= delta;
      scale = Math.min(Math.max(0.3, scale), 2);
      updateTransform();
    });

    function zoomIn() { scale *= 1.2; scale = Math.min(scale, 2); updateTransform(); }
    function zoomOut() { scale *= 0.8; scale = Math.max(scale, 0.3); updateTransform(); }

    function showInfo(title, desc) {
      infoTitle.textContent = title;
      infoDesc.textContent = desc;
      infoPanel.classList.add('visible');
    }

    svg.addEventListener('click', (e) => {
      if (e.target.closest('.marker')) return;
      infoPanel.classList.remove('visible');
    });

    updateTransform();
  </script>

  <footer class="pagefoot">
    <div class="container" style="text-align: center;">
      <p>© 2026 Deep Dive Online · Карта мира обновляется в реальном времени.</p>
    </div>
  </footer>
</body>
</html>
